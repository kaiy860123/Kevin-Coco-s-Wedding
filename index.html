<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin & Coco's Wedding Portal</title>
    <style>
        :root {
            --primary-color: #8c7355;
            --bg-color: #fcfbf9;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-family: 'Georgia', serif;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: inline-block;
            padding: 15px 25px;
            background-color: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: var(--primary-color);
            color: white;
        }
        .btn.admin {
            background-color: #f5f5f5;
            border-color: #ccc;
            color: #555;
        }
        .btn.admin:hover {
            background-color: #ccc;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kevin & Coco's Wedding</h1>
        <p>歡迎來到我們的婚禮籌備與導覽中心。<br>請選擇您要前往的頁面：</p>
        
        <div class="btn-group">
            <a href="./invitation/?loc=tainan" class="btn">💌 填寫邀請函 (台南場)</a>
            <a href="./invitation/?loc=nantou" class="btn">💌 填寫邀請函 (南投場)</a>
            
            <hr style="width: 100%; border: 0; border-top: 1px solid #eee; margin: 10px 0;">
            
            <a href="./seating/" class="btn admin">⚙️ 排座小幫手 (內部管理)</a>
        </div>
    </div>
</body>
</html>
