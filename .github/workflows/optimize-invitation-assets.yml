name: Optimize Invitation Assets

on:
  push:
    branches:
      - main
    paths:
      - "invitation/images/**"
      - "invitation/fonts/**"
      - "invitation/index.html"
      - "invitation/app.js"
      - "invitation/style.css"
      - "tools/optimize_invitation_assets.py"
      - ".github/workflows/optimize-invitation-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-invitation-assets
  cancel-in-progress: false

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optimization tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow fonttools brotli

      - name: Optimize invitation assets
        run: |
          python tools/optimize_invitation_assets.py

      - name: Show optimized sizes
        run: |
          echo "Active invitation assets:"
          du -h invitation/images/hero-cover.jpg                 invitation/images/6.jpg                 invitation/images/7.jpg                 invitation/images/8.jpg                 invitation/images/moment-01.jpg                 invitation/images/moment-02.jpg                 invitation/images/moment-03.jpg                 invitation/images/moment-04.jpg                 invitation/images/countdown-tainan.jpg                 invitation/images/countdown-nantou.jpg                 invitation/images/monogram-kc-black.png                 invitation/fonts/GenWanMin2-L-subset.woff2 2>/dev/null || true
          echo
          echo "Invitation directory total:"
          du -sh invitation

      - name: Commit optimized assets
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No optimization changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A invitation/images invitation/fonts invitation/style.css
          git commit -m "Optimize invitation assets for web delivery"
          git push
